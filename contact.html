<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Olive Nwafor">
    <title>Contact – Olive Nwafor</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0F1115;
            --bg-secondary: #161A22;
            --border-color: #232837;
            --text-primary: #E6EAF0;
            --text-secondary: #A4ACB9;
            --text-muted: #7A8293;
            --accent-primary: #4F7DFF;
            --accent-hover: #6B92FF;
            --hover-overlay: rgba(79, 125, 255, 0.08);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .top-nav .logo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 24px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .top-nav .logo:hover { color: var(--accent-hover); }

        .top-nav .nav-items {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .top-nav .nav-items a {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .top-nav .nav-items a:hover,
        .top-nav .nav-items a.active { color: var(--text-primary); }

        .social-icons {
            display: flex;
            gap: 16px;
            margin-left: 16px;
        }

        .social-icons a {
            color: var(--text-muted);
            transition: color 0.3s ease;
            display: flex;
        }

        .social-icons a:hover { color: var(--text-primary); }
        .social-icons svg { width: 16px; height: 16px; }

        .page-content {
            max-width: 560px;
            margin: 0 auto;
            padding: 80px 24px 120px;
            animation: fadeIn 0.8s ease-out;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 48px;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 16px;
        }

        .page-subtitle {
            text-align: center;
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 300;
            margin-bottom: 48px;
        }

        /* Contact form */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea {
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 300;
            color: var(--text-primary);
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(79, 125, 255, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 160px;
        }

        .submit-btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-primary);
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-start;
        }

        .submit-btn:hover {
            border-color: var(--accent-primary);
            background-color: var(--hover-overlay);
            color: var(--accent-hover);
        }

        /* Success message */
        .form-success {
            display: none;
            text-align: center;
            padding: 24px;
            color: var(--accent-primary);
            font-size: 15px;
            font-weight: 400;
        }

        /* Error message */
        .form-error {
            display: none;
            text-align: center;
            padding: 24px;
            color: #FF6B6B;
            font-size: 15px;
            font-weight: 400;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Footer */
        .site-footer {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid var(--border-color);
        }

        .site-footer .footer-logo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 20px;
            color: var(--text-muted);
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }

        .site-footer p {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .top-nav {
                flex-direction: column;
                gap: 16px;
                padding: 20px 24px;
            }
            .top-nav .nav-items {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .social-icons { margin-left: 0; }
            .page-title { font-size: 36px; }
            .page-content { padding: 60px 24px 80px; }
        }

        @media (max-width: 480px) {
            .top-nav .nav-items { gap: 16px; }
            .page-title { font-size: 30px; }
            .submit-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="index.html" class="logo">Olive Nwafor</a>
        <div class="nav-items">
            <a href="about.html">About</a>
            <a href="work.html">Work</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html" class="active">Contact</a>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/olivenwafor" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                </a>
                <a href="https://github.com/CloudOlive" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                </a>
            </div>
        </div>
    </nav>

    <main class="page-content">
        <h1 class="page-title">contact</h1>
        <p class="page-subtitle">Reach me here.</p>

        <form class="contact-form" id="contactForm" action="https://formspree.io/f/nwaforolive22@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="New message from your website">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email" required>
            </div>

            <div class="form-group">
                <label for="message">Note</label>
                <textarea id="message" name="message" placeholder="Your message" required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
        </form>

        <div class="form-success" id="formSuccess">
            Thank you for reaching out. I'll get back to you soon.
        </div>

        <div class="form-error" id="formError">
            Something went wrong. Please try again or email me directly.
        </div>
    </main>

    <footer class="site-footer">
        <a href="index.html" class="footer-logo">Olive Nwafor</a>
        <p>&copy; 2026 Olive Nwafor. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var form = this;
            var btn = document.getElementById('submitBtn');
            var successMsg = document.getElementById('formSuccess');
            var errorMsg = document.getElementById('formError');

            // Disable button during submission
            btn.disabled = true;
            btn.textContent = 'Sending...';

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            })
            .then(function(response) {
                if (response.ok) {
                    form.style.display = 'none';
                    successMsg.style.display = 'block';
                    errorMsg.style.display = 'none';
                    form.reset();
                } else {
                    throw new Error('Form submission failed');
                }
            })
            .catch(function() {
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Submit';
            });
        });
    </script>
</body>
</html>
