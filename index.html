<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Olive Nwafor - Product Manager specializing in AI-enabled products">
    <title>Olive Nwafor</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        .landing {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0F1115;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(79, 125, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(79, 125, 255, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(79, 125, 255, 0.03) 0%, transparent 60%);
            overflow: hidden;
        }

        /* Subtle animated grain texture */
        .landing::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        .landing-content {
            position: relative;
            z-index: 2;
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        .site-name {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 72px;
            color: #E6EAF0;
            letter-spacing: 0.02em;
            margin-bottom: 40px;
            line-height: 1.1;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #A4ACB9;
            text-decoration: none;
            transition: color 0.3s ease;
            padding: 4px 0;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background-color: #4F7DFF;
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: #E6EAF0;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .site-name {
                font-size: 52px;
                margin-bottom: 32px;
            }

            .nav-links {
                gap: 24px;
            }

            .nav-links a {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .site-name {
                font-size: 40px;
                margin-bottom: 28px;
            }

            .nav-links {
                gap: 20px;
                padding: 0 20px;
            }

            .nav-links a {
                font-size: 11px;
                letter-spacing: 0.12em;
            }
        }
    </style>
</head>
<body>
    <div class="landing">
        <div class="landing-content">
            <h1 class="site-name">Olive Nwafor</h1>
            <nav class="nav-links">
                <a href="/about">About</a>
                <a href="/work">Work</a>
                <a href="/blog">Blog</a>
                <a href="/contact">Contact</a>
            </nav>
        </div>
    </div>
</body>
</html>
